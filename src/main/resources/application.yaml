server:
  port: 8080

spring:
  application:
    name: paymentExport

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/payment_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true

  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

app:
  api:
    base-url: ${APP_API_BASE_URL:http://localhost:8080}
